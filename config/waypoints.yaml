# Coordinates from the existing maze map; radians, in frame map.
# Re-survey these points when replacing map.yaml or changing the world.
waypoint_navigator:
  ros__parameters:
    use_sim_time: true
    goal_x: [-2.0, 2.0, -2.0]
    goal_y: [-3.0, -3.0, 4.0]
    goal_yaw: [0.0, 0.0, 1.5707963267948966]
    readiness_timeout: 120.0
    goal_timeout: 300.0
    pause_at_goal: 3.0
    result_file: /tmp/tb4_waypoints.json
